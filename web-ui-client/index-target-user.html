<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders Realtime - SSE Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Orders Realtime - Multi-User SSE Demo</h1>
            <button id="add-panel-btn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">
                + Add User Panel
            </button>
        </div>

        <div id="panels-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Panels will be dynamically added here -->
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://localhost:3001";
      let panelCounter = 0;

      // Add initial panel
      document.getElementById("add-panel-btn").addEventListener("click", () => {
        createUserPanel();
      });

      // Create initial panel on load
      createUserPanel();

      function createUserPanel() {
        panelCounter++;
        const panelId = `panel-${panelCounter}`;
        const panelsGrid = document.getElementById("panels-grid");

        const panel = document.createElement("div");
        panel.id = panelId;
        panel.className = "bg-white rounded-lg shadow-md p-6 flex flex-col h-full";

        panel.innerHTML = `
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-semibold text-gray-800">User Panel ${panelCounter}</h2>
            <button
              class="text-red-500 hover:text-red-700 text-sm font-medium"
              onclick="removePanel('${panelId}')"
            >
              Remove
            </button>
          </div>

          <div class="mb-4 space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                User ID
              </label>
              <div class="flex gap-2">
                <input
                  type="text"
                  id="${panelId}-user-id"
                  placeholder="e.g., user-001"
                  class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <button
                  id="${panelId}-login-btn"
                  class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors"
                  onclick="loginUser('${panelId}')"
                >
                  Login
                </button>
              </div>
            </div>

            <div id="${panelId}-token-display" class="hidden">
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Token (SLT)
              </label>
              <div class="flex items-center gap-2">
                <input
                  type="text"
                  id="${panelId}-token"
                  readonly
                  class="flex-1 border border-gray-300 rounded-lg px-3 py-2 bg-gray-50 text-sm font-mono"
                />
                <button
                  onclick="copyToken('${panelId}')"
                  class="bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 px-3 rounded-lg text-sm transition-colors"
                  title="Copy token"
                >
                  📋
                </button>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2 mb-4">
            <div
              id="${panelId}-status-indicator"
              class="w-3 h-3 rounded-full bg-gray-400"
            ></div>
            <span id="${panelId}-status-text" class="text-sm text-gray-600">Not connected</span>
          </div>

          <div class="flex-1 overflow-hidden flex flex-col">
            <h3 class="text-sm font-semibold text-gray-700 mb-2">Orders</h3>
            <div
              id="${panelId}-orders-container"
              class="flex-1 overflow-y-auto space-y-3 min-h-0 max-h-80"
            >
              <p class="text-gray-500 text-center py-8 text-sm">No orders yet...</p>
            </div>
          </div>
        `;

        panelsGrid.appendChild(panel);
      }

      function removePanel(panelId) {
        const panel = document.getElementById(panelId);
        if (panel) {
          // Close any active EventSource connection
          const eventSource = panel._eventSource;
          if (eventSource) {
            eventSource.close();
          }
          panel.remove();
        }
      }

      async function loginUser(panelId) {
        const userIdInput = document.getElementById(`${panelId}-user-id`);
        const loginBtn = document.getElementById(`${panelId}-login-btn`);
        const tokenDisplay = document.getElementById(`${panelId}-token-display`);
        const tokenInput = document.getElementById(`${panelId}-token`);
        const statusIndicator = document.getElementById(`${panelId}-status-indicator`);
        const statusText = document.getElementById(`${panelId}-status-text`);
        const ordersContainer = document.getElementById(`${panelId}-orders-container`);

          const userId = userIdInput.value.trim();

          const userName = userId;

        if (!userId) {
          alert("Please enter a User ID");
          return;
        }

        // Disable login button
        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";
        statusText.textContent = "Logging in...";
        statusIndicator.className = "w-3 h-3 rounded-full bg-yellow-500 animate-pulse";

        try {
          const response = await fetch(`${API_BASE_URL}/api/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
              body: JSON.stringify({ userName }),
          });

          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || "Login failed");
          }

          const data = await response.json();
          const token = data.token;

          // Display token
          tokenInput.value = token;
          tokenDisplay.classList.remove("hidden");

          // Close any existing connection
          const panel = document.getElementById(panelId);
          if (panel._eventSource) {
            panel._eventSource.close();
          }

          // Clear previous orders
          ordersContainer.innerHTML =
            '<p class="text-gray-500 text-center py-8 text-sm">Waiting for orders...</p>';

          // Start SSE connection
          startEventStream(panelId, token);

          statusText.textContent = "Connected";
          statusIndicator.className = "w-3 h-3 rounded-full bg-green-500 animate-pulse";
        } catch (error) {
          console.error("Login error:", error);
          alert(`Login failed: ${error.message}`);
          statusText.textContent = "Login failed";
          statusIndicator.className = "w-3 h-3 rounded-full bg-red-500";
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
        }
      }

      function startEventStream(panelId, token) {
        const statusIndicator = document.getElementById(`${panelId}-status-indicator`);
        const statusText = document.getElementById(`${panelId}-status-text`);
        const ordersContainer = document.getElementById(`${panelId}-orders-container`);
        const panel = document.getElementById(panelId);

        const eventSource = new EventSource(
            `${API_BASE_URL}/api/orders/buffer-stream?token=${encodeURIComponent(token)}`
        );

        panel._eventSource = eventSource;

        eventSource.addEventListener("order", (event) => {
          try {
            const eventData = JSON.parse(event.data);
            addOrder(panelId, eventData.data, eventData.eventId);
          } catch (error) {
            console.error("Error parsing order:", error);
          }
        });

        eventSource.onopen = () => {
          statusIndicator.className = "w-3 h-3 rounded-full bg-green-500 animate-pulse";
          statusText.textContent = "Connected";
        };

        eventSource.onerror = () => {
          if (eventSource.readyState === EventSource.CONNECTING) {
            statusIndicator.className = "w-3 h-3 rounded-full bg-yellow-500 animate-pulse";
            statusText.textContent = "Reconnecting...";
          } else if (eventSource.readyState === EventSource.CLOSED) {
            statusIndicator.className = "w-3 h-3 rounded-full bg-red-500";
            statusText.textContent = "Disconnected";
          }
        };
      }

      function addOrder(panelId, order, eventId) {
        const ordersContainer = document.getElementById(`${panelId}-orders-container`);

        // Remove "Waiting for orders..." message if present
        const waitingMessage = ordersContainer.querySelector("p");
        if (waitingMessage && waitingMessage.textContent.includes("Waiting")) {
          waitingMessage.remove();
        }

        // Create order element
        const orderElement = document.createElement("div");
        orderElement.className =
          "border border-gray-200 rounded-lg p-3 hover:shadow-md transition-shadow bg-white";
        orderElement.setAttribute("data-event-id", eventId);

        const timestamp = new Date(order.timestamp).toLocaleString();

        orderElement.innerHTML = `
          <div class="flex items-start justify-between">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1 flex-wrap">
                <span class="font-semibold text-base text-gray-800">${order.externalId}</span>
                <span class="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded">Event: ${
                  eventId || "N/A"
                }</span>
              </div>
              <p class="text-gray-600 text-sm mb-1">${order.customerName}</p>
              <p class="text-xs text-gray-500">${timestamp}</p>
            </div>
            <div class="text-right ml-2">
              <p class="text-xl font-bold text-green-600">$${order.amount.toFixed(2)}</p>
            </div>
          </div>
        `;

        // Insert at the top (newest first)
        ordersContainer.insertBefore(orderElement, ordersContainer.firstChild);
      }

      function copyToken(panelId) {
        const tokenInput = document.getElementById(`${panelId}-token`);
        tokenInput.select();
        document.execCommand("copy");

        // Visual feedback
        const btn = event.target;
        const originalText = btn.textContent;
        btn.textContent = "✓";
        setTimeout(() => {
          btn.textContent = originalText;
        }, 1000);
      }

      // Make functions available globally for onclick handlers
      window.removePanel = removePanel;
      window.loginUser = loginUser;
      window.copyToken = copyToken;
    </script>
</body>
</html>
